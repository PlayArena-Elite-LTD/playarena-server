databases:
  - name: playyarena-db
    databaseName: playyarena
    user: playyarena
    plan: free

services:
  - type: web
    name: playyarena
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: playyarena-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PAYMENT_GATEWAY_TEST_MODE
        value: "true"
      - key: BANK_PAYOUT_MODE
        value: "mock"
