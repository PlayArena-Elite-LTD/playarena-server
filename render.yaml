databases:
  - name: playarena-db
    databaseName: playarena
    user: playarena
    plan: free

services:
  - type: web
    name: playarena
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && exec gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: playarena-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        value: "https://www.playarenaelite.com"
      - key: SECRET_KEY
        generateValue: true
      - key: PAYMENT_GATEWAY_TEST_MODE
        value: "false"
      - key: LIPILA_MOCK_MODE
        value: "false"
      - key: LIPILA_BASE_URL
        value: "https://api.lipila.dev"
      - key: LIPILA_TIMEOUT_SECONDS
        value: "60"
      - key: LIPILA_MOBILE_MONEY_PATH
        value: "/api/v1/collections/mobile-money"
      - key: LIPILA_MOBILE_MONEY_DISBURSEMENT_PATH
        value: "/api/v1/disbursements/mobile-money"
      - key: LIPILA_SECRET_KEY
        sync: false
      - key: LIPILA_WEBHOOK_SECRET
        sync: false
      - key: ZYNLE_BASE_URL
        value: "https://sandbox.zynlepay.com/zynlepay/jsonapi"
      - key: ZYNLE_API_KEY
        sync: false
      - key: ZYNLE_API_ID
        sync: false
      - key: ZYNLE_MERCHANT_ID
        sync: false
      - key: ZYNLE_CALLBACK_TOKEN
        generateValue: true
      - key: BANK_PAYOUT_MODE
        value: "mock"
