<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>429 - Too Many Requests | PlayArena</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <link rel="stylesheet" href="{% static 'styles/style.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1419 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .error-container {
            text-align: center;
            max-width: 640px;
            width: 100%;
        }

        .error-code {
            font-size: 7rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-accent-gold) 0%, var(--color-accent-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
        }

        .error-title {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1rem;
        }

        .error-description {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .retry-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            margin: 0 auto 2rem;
            max-width: 420px;
        }

        .retry-card p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
        }

        .retry-timer {
            font-weight: 600;
            color: #ffffff;
        }

        .error-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, var(--color-accent-green) 0%, var(--color-accent-gold) 100%);
            color: #0a0e27;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow:
                0 4px 15px rgba(0, 217, 255, 0.3),
                0 0 30px rgba(0, 217, 255, 0.1);
        }

        .error-button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 6px 20px rgba(0, 217, 255, 0.4),
                0 0 40px rgba(0, 217, 255, 0.2);
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 5rem;
            }
            .error-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">429</div>
        <h1 class="error-title">Too Many Attempts</h1>
        <p class="error-description">
            You've hit the request limit. Please wait a little and try again.
        </p>
        <div class="retry-card">
            <p>Try again in <span class="retry-timer" id="retry-timer" data-retry-after="{{ retry_after|default:0 }}">{{ retry_after_human|default:"a moment" }}</span>.</p>
        </div>
        <a href="{% url 'index' %}" class="error-button">Go to Homepage</a>
    </div>

    <script>
        (function () {
            const timerEl = document.getElementById('retry-timer');
            if (!timerEl) {
                return;
            }
            let seconds = parseInt(timerEl.dataset.retryAfter || '0', 10);

            const formatTime = (value) => {
                if (value <= 1) {
                    return '1 second';
                }
                if (value < 60) {
                    return `${value} seconds`;
                }
                const minutes = Math.floor(value / 60);
                const remaining = value % 60;
                if (minutes < 60) {
                    if (remaining) {
                        return `${minutes} minute${minutes === 1 ? '' : 's'} ${remaining} seconds`;
                    }
                    return `${minutes} minute${minutes === 1 ? '' : 's'}`;
                }
                const hours = Math.floor(minutes / 60);
                const minutesLeft = minutes % 60;
                if (minutesLeft) {
                    return `${hours} hour${hours === 1 ? '' : 's'} ${minutesLeft} minutes`;
                }
                return `${hours} hour${hours === 1 ? '' : 's'}`;
            };

            const tick = () => {
                if (seconds <= 0) {
                    timerEl.textContent = 'now';
                    return;
                }
                timerEl.textContent = formatTime(seconds);
                seconds -= 1;
                setTimeout(tick, 1000);
            };

            tick();
        })();
    </script>
</body>
</html>
