{% extends "admin/base.html" %}

{% block title %}{{ site_title|default:_("PlayArena Admin") }}{% endblock %}

{% block bodyclass %}{{ block.super }} nav-sidebar-closed{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  :root {
    --admin-bg: #0f172a;
    --admin-surface: #111827;
    --admin-border: rgba(148, 163, 184, 0.2);
    --admin-text: #e2e8f0;
    --admin-muted: #94a3b8;
    --admin-accent: #22d3ee;
    --admin-accent-2: #a78bfa;
    --admin-shadow: 0 16px 32px rgba(2, 6, 23, 0.45);
  }

  body {
    background: var(--admin-bg);
    color: var(--admin-text);
  }

  #header {
    background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(167, 139, 250, 0.18));
    border-bottom: 1px solid var(--admin-border);
  }

  #branding h1,
  #branding h1 a {
    color: #f8fafc;
    letter-spacing: 0.03em;
  }

  #user-tools,
  #user-tools a {
    color: var(--admin-muted);
  }

  #content,
  .module,
  .app-table,
  .dashboard-module {
    background: var(--admin-surface);
    border: 1px solid var(--admin-border);
    border-radius: 12px;
    box-shadow: var(--admin-shadow);
  }

  .module h2,
  .module caption,
  .section h2 {
    color: #f8fafc;
  }

  a:link,
  a:visited {
    color: var(--admin-accent);
  }

  a:hover,
  a:focus {
    color: var(--admin-accent-2);
  }

  .button,
  input[type="submit"],
  input[type="button"],
  .submit-row input {
    background: linear-gradient(135deg, rgba(34, 211, 238, 0.9), rgba(59, 130, 246, 0.85));
    border: 1px solid rgba(34, 211, 238, 0.6);
    color: #0b1020;
    border-radius: 10px;
    box-shadow: 0 10px 24px rgba(34, 211, 238, 0.25);
  }

  .button:focus,
  .button:hover,
  input[type="submit"]:hover {
    box-shadow: 0 14px 30px rgba(34, 211, 238, 0.4);
  }

  input,
  select,
  textarea {
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid var(--admin-border);
    color: var(--admin-text);
    border-radius: 8px;
  }

  .breadcrumbs {
    background: rgba(15, 23, 42, 0.6);
    border-bottom: 1px solid var(--admin-border);
  }

  .breadcrumb,
  .breadcrumbs a {
    color: var(--admin-muted);
  }

  .object-tools a {
    background: rgba(34, 211, 238, 0.15);
    border: 1px solid rgba(34, 211, 238, 0.3);
    border-radius: 8px;
    color: #e2e8f0;
  }

  .object-tools a:hover {
    background: rgba(34, 211, 238, 0.25);
  }

  .admin-kpis {
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    margin-bottom: 24px;
  }

  .admin-kpi-card {
    background: var(--admin-surface);
    border: 1px solid var(--admin-border);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: var(--admin-shadow);
  }

  .admin-kpi-label {
    color: var(--admin-muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .admin-kpi-value {
    font-size: 1.6rem;
    font-weight: 700;
    color: #f8fafc;
    margin-top: 6px;
  }

  .admin-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
  }

  .admin-action-button {
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid rgba(34, 211, 238, 0.4);
    background: rgba(15, 23, 42, 0.7);
    color: #e2e8f0;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .admin-action-button:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 22px rgba(34, 211, 238, 0.25);
  }

  .app-grid {
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  }

  .app-card {
    background: rgba(15, 23, 42, 0.65);
    border: 1px solid var(--admin-border);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: var(--admin-shadow);
    display: grid;
    gap: 12px;
  }

  .app-card__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .app-card__title {
    font-size: 1.05rem;
    font-weight: 700;
    color: #f8fafc;
    margin: 0;
  }

  .app-card__link {
    color: var(--admin-accent);
    text-decoration: none;
    font-size: 0.85rem;
  }

  .app-card__models {
    display: grid;
    gap: 8px;
  }

  .app-card__model {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.55);
    border: 1px solid rgba(148, 163, 184, 0.12);
  }

  .app-card__model-name {
    color: #e2e8f0;
    font-weight: 600;
  }

  .app-card__actions {
    display: flex;
    gap: 8px;
  }

  .app-card__actions a {
    font-size: 0.75rem;
    color: var(--admin-muted);
  }

  .row1,
  .row2 {
    background: transparent;
    border-bottom: 1px solid rgba(148, 163, 184, 0.12);
  }

  #changelist-filter {
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid var(--admin-border);
    border-radius: 10px;
  }

  .paginator {
    color: var(--admin-muted);
  }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">PlayArena Admin</a></h1>
{% endblock %}
