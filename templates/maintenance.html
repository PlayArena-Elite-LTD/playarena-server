<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance - PlayArena</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <link rel="stylesheet" href="{% static 'styles/style.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1419 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: #ffffff;
        }

        /* Light mode styles */
        body:not(.dark-theme) {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 50%, #f1f5f9 100%);
            color: #1e293b;
        }

        /* Animated background gradient */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(0, 217, 255, 0.1) 0%,
                rgba(0, 184, 169, 0.15) 50%,
                rgba(0, 217, 255, 0.1) 100%
            );
            animation: gradientShift 8s ease infinite;
            z-index: 0;
        }

        /* Light mode background gradient */
        body:not(.dark-theme) .bg-gradient {
            background: linear-gradient(
                135deg,
                rgba(8, 145, 178, 0.05) 0%,
                rgba(124, 58, 237, 0.08) 50%,
                rgba(236, 72, 153, 0.05) 100%
            );
        }

        @keyframes gradientShift {
            0%, 100% {
                opacity: 0.5;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.1);
            }
        }

        /* Floating geometric shapes */
        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 200px;
            height: 200px;
            background: var(--color-accent-green);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 150px;
            height: 150px;
            background: var(--color-accent-gold);
            border-radius: 50%;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .shape-3 {
            width: 100px;
            height: 100px;
            background: var(--color-accent-green-light);
            transform: rotate(45deg);
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                transform: translate(30px, -30px) rotate(120deg);
            }
            66% {
                transform: translate(-20px, 20px) rotate(240deg);
            }
        }

        /* Main container */
        .maintenance-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
        }

        /* Glassmorphism card */
        .maintenance-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 0 60px rgba(0, 217, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardEntrance 0.8s ease-out;
        }

        /* Light mode card */
        body:not(.dark-theme) .maintenance-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.3);
            box-shadow: 
                0 8px 32px rgba(15, 23, 42, 0.1),
                0 0 60px rgba(8, 145, 178, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Icon */
        .maintenance-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .maintenance-icon::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--color-accent-green);
            border-radius: 50%;
            opacity: 0.2;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.2;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.1;
            }
        }

        .maintenance-icon svg {
            width: 100%;
            height: 100%;
            fill: var(--color-accent-green);
            filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.5));
            position: relative;
            z-index: 1;
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* Heading */
        .maintenance-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--color-accent-green) 0%, var(--color-accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 217, 255, 0.3);
        }

        /* Description */
        .maintenance-description {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Button */
        .back-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, var(--color-accent-green) 0%, var(--color-accent-gold) 100%);
            color: #0a0e27;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 
                0 4px 15px rgba(0, 217, 255, 0.3),
                0 0 30px rgba(0, 217, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .back-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .back-button:hover::before {
            left: 100%;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 20px rgba(0, 217, 255, 0.4),
                0 0 40px rgba(0, 217, 255, 0.2);
        }

        .back-button:active {
            transform: translateY(0);
        }

        /* Glow effect */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--color-accent-green) 0%, transparent 70%);
            opacity: 0.3;
            filter: blur(60px);
            animation: glowMove 10s infinite ease-in-out;
            pointer-events: none;
        }

        .glow-1 {
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .glow-2 {
            bottom: -150px;
            right: -150px;
            background: radial-gradient(circle, var(--color-accent-gold) 0%, transparent 70%);
            animation-delay: 5s;
        }

        @keyframes glowMove {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(50px, 50px) scale(1.2);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .maintenance-card {
                padding: 2rem 1.5rem;
            }

            .maintenance-title {
                font-size: 2rem;
            }

            .maintenance-description {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <div class="maintenance-container">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        
        <div class="maintenance-card">
            <div class="maintenance-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
            </div>
            
            <h1 class="maintenance-title">Under Maintenance</h1>
            
            <p class="maintenance-description">
                We're currently working on improving your experience. 
                Our authentication system is temporarily unavailable while we make some exciting updates.
                <br><br>
                Please check back soon!
            </p>
            
            <a href="{% url 'index' %}" class="back-button">Back to Landing Page</a>
        </div>
    </div>
</body>
</html>
