{% extends "base.html" %}

{% block content %}
<section class="auth-section">
  <div class="auth-container">
    <div class="auth-header">
        <h2>Password Changed</h2>
        <p>Your password has been updated</p>
    </div>

    <div class="auth-form">
        <p>Your password has been successfully changed. You may continue using the site with your new credentials.</p>
        <a href="{% url 'profile' %}" class="button">Back to Profile</a>
    </div>
  </div>
</section>
{% endblock %}
