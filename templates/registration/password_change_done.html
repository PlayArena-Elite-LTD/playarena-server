{% extends "base.html" %}

{% block content %}
<style>
  .auth-container { background: var(--neo-surface); border: 1px solid var(--neo-border); border-radius: 16px; box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08); }
  .auth-header h2 { color: var(--neo-text); }
  .auth-header p { color: var(--neo-soft); }
  .auth-form .button { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border-radius: 12px; font-weight: 700; border: 1px solid rgba(34, 211, 238, 0.5); background: linear-gradient(135deg, rgba(34, 211, 238, 0.85), rgba(59, 130, 246, 0.85)); color: #0b1020; text-decoration: none; }
</style>
<section class="auth-section neo-section">
  <div class="auth-container">
    <div class="auth-header">
        <h2>Password Changed</h2>
        <p>Your password has been updated</p>
    </div>

    <div class="auth-form">
        <p>Your password has been successfully changed. You may continue using the site with your new credentials.</p>
        <a href="{% url 'profile' %}" class="button">Back to Profile</a>
    </div>
  </div>
</section>
{% endblock %}
