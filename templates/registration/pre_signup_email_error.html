{% extends "base.html" %}

{% block content %}
<section class="auth-section">
	<div class="auth-container">
    <div class="auth-header">
        <h2>Invalid Registration Link</h2>
    </div>

    <div class="auth-form">
        <p>The registration link you used is invalid or has expired.</p>
    </div>

    <div class="auth-footer">
        <p><a href="{% url 'pre_signup' %}">Request a new registration link</a></p>
    </div>
</div>
</section>
{% endblock %}
