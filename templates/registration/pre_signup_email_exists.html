{% extends "base.html" %}

{% block content %}
<section class="auth-section">
	<div class="auth-container">
    <div class="auth-header">
        <h2>Email Already Registered</h2>
    </div>

    <div class="auth-form">
        <p>An account with the email {{ email }} already exists.</p>
				<p>Please use a different email address or log in to your existing account.</p>
    </div>

    <div class="auth-footer">
        <p><a href="{% url 'login' %}">Log in</a> or <a href="{% url 'pre_signup' %}">Go back</a> to signup page.</p>
    </div>
</div>
</section>
{% endblock %}
