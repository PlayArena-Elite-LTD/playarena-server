<style>
  .wallet-theme {
    --wallet-bg: #0a0f1d;
    --wallet-surface: rgba(12, 19, 38, 0.82);
    --wallet-border: rgba(148, 163, 184, 0.2);
    --wallet-text: #d2d9e6;
    --wallet-heading: #f8fafc;
    --wallet-accent: #22d3ee;
    --wallet-accent-2: #a78bfa;
    --wallet-accent-3: #f472b6;
    --wallet-shadow: 0 18px 40px rgba(5, 8, 20, 0.45);
    --wallet-soft-shadow: 0 8px 22px rgba(10, 15, 30, 0.28);
  }

  /* Light mode colors for wallet theme */
  body:not(.dark-theme) .wallet-theme {
    --wallet-bg: #ffffff;
    --wallet-surface: rgba(248, 250, 252, 0.95);
    --wallet-border: rgba(148, 163, 184, 0.3);
    --wallet-text: #334155;
    --wallet-heading: #0f172a;
    --wallet-accent: #0891b2;
    --wallet-accent-2: #7c3aed;
    --wallet-accent-3: #ec4899;
    --wallet-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    --wallet-soft-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
  }

  .wallet-theme.section {
    background:
      radial-gradient(1200px 700px at 10% -10%, rgba(34, 211, 238, 0.16), transparent 60%),
      radial-gradient(900px 600px at 90% -20%, rgba(167, 139, 250, 0.18), transparent 60%),
      var(--wallet-bg);
    border-radius: 18px;
  }

  .wallet-theme .container {
    padding: 24px;
  }

  .wallet-theme .section-title,
  .wallet-theme h2,
  .wallet-theme h3 {
    color: var(--wallet-heading);
  }

  .wallet-theme .wallet-subtitle {
    color: var(--wallet-text);
    margin: 0.35rem 0 1.5rem;
  }

  .wallet-theme .wallet-header,
  .wallet-theme .form-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .wallet-theme .header-actions {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .wallet-theme .dash-muted,
  .wallet-theme .form-help,
  .wallet-theme .transaction-date,
  .wallet-theme .transaction-type,
  .wallet-theme .balance-label,
  .wallet-theme .match-creator-label {
    color: var(--wallet-text);
  }

  .wallet-theme .dashboard-card,
  .wallet-theme .match-form-container,
  .wallet-theme .form-container,
  .wallet-theme .match-creator-header {
    background: var(--wallet-surface);
    border: 1px solid var(--wallet-border);
    border-radius: 16px;
    padding: 18px;
    box-shadow: var(--wallet-shadow);
    backdrop-filter: blur(14px);
    color: var(--wallet-heading);
  }

  .wallet-theme .form-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 2rem;
  }

  .wallet-theme .wallet-info-card {
    background: linear-gradient(135deg, rgba(34, 211, 238, 0.22), rgba(167, 139, 250, 0.22));
    border: 1px solid rgba(34, 211, 238, 0.3);
    box-shadow: var(--wallet-soft-shadow);
    color: var(--wallet-heading);
    border-radius: 16px;
    padding: 1.5rem;
    text-align: center;
    margin-bottom: 2rem;
  }

  .wallet-theme .dashboard-balance-amount,
  .wallet-theme .balance-amount,
  .wallet-theme .match-creator-amount {
    color: var(--wallet-heading);
    text-shadow: 0 0 14px rgba(34, 211, 238, 0.35);
  }

  .wallet-theme .dashboard-button,
  .wallet-theme .form-button-primary,
  .wallet-theme .form-button-secondary {
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--wallet-border);
    background: var(--wallet-surface);
    color: var(--wallet-text);
    font-weight: 600;
    transition: all 0.2s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .wallet-theme .dashboard-button:hover,
  .wallet-theme .form-button-secondary:hover {
    background: rgba(34, 211, 238, 0.15);
    border-color: rgba(34, 211, 238, 0.4);
    color: var(--wallet-heading);
  }

  .wallet-theme .form-button-primary,
  .wallet-theme .dashboard-button-primary {
    background: linear-gradient(135deg, var(--wallet-accent), var(--wallet-accent-2));
    color: #0b1020;
    border-color: var(--wallet-accent);
    font-weight: 700;
  }

  /* Light mode wallet buttons */
  body:not(.dark-theme) .wallet-theme .dashboard-button,
  body:not(.dark-theme) .wallet-theme .form-button-secondary {
    background: #f8fafc;
    color: #334155;
    border-color: #cbd5e1;
  }

  body:not(.dark-theme) .wallet-theme .dashboard-button:hover,
  body:not(.dark-theme) .wallet-theme .form-button-secondary:hover {
    background: #e2e8f0;
    border-color: #94a3b8;
    color: #1e293b;
  }

  body:not(.dark-theme) .wallet-theme .form-button-primary,
  body:not(.dark-theme) .wallet-theme .dashboard-button-primary {
    background: linear-gradient(135deg, #0891b2, #2563eb);
    color: #ffffff;
    border-color: #0891b2;
  }

  body:not(.dark-theme) .wallet-theme .form-button-primary:hover,
  body:not(.dark-theme) .wallet-theme .dashboard-button-primary:hover {
    background: linear-gradient(135deg, #0e7490, #1d4ed8);
  }

  .wallet-theme .form-group input,
  .wallet-theme .form-group select,
  .wallet-theme .form-group textarea,
  .wallet-theme .match-form input,
  .wallet-theme .match-form select,
  .wallet-theme .match-form textarea {
    width: 100%;
    border-radius: 12px;
    border: 1px solid rgba(148, 163, 184, 0.25);
    background: rgba(10, 15, 30, 0.7);
    color: var(--wallet-heading);
    padding: 0.75rem 0.9rem;
  }

  .wallet-theme .form-control,
  .wallet-theme .form-select {
    width: 100%;
    padding: 0.75rem 0.9rem;
    border-radius: 12px;
    border: 1px solid rgba(148, 163, 184, 0.25);
    background: rgba(10, 15, 30, 0.7);
    color: var(--wallet-heading);
    font-size: 1rem;
    transition: all 0.2s ease;
  }

  .wallet-theme .form-control:focus,
  .wallet-theme .form-select:focus {
    outline: none;
    border-color: rgba(34, 211, 238, 0.6);
    box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2);
  }

  .wallet-theme .form-label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 600;
    color: var(--wallet-text);
  }

  .wallet-theme .required {
    color: var(--wallet-accent-3);
  }

  .wallet-theme .form-help {
    display: block;
    margin-top: 0.5rem;
    font-size: 0.85rem;
    color: var(--wallet-text);
  }

  .wallet-theme .form-help a {
    color: var(--wallet-accent);
    text-decoration: none;
  }

  .wallet-theme .form-help a:hover {
    text-decoration: underline;
  }

  .wallet-theme .form-error,
  .wallet-theme .form-field-error {
    color: var(--wallet-accent-3);
    font-size: 0.85rem;
    margin-top: 0.5rem;
  }

  .wallet-theme .form-actions {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--wallet-border);
    flex-wrap: wrap;
  }

  .wallet-theme .form-group input:focus,
  .wallet-theme .form-group select:focus,
  .wallet-theme .form-group textarea:focus,
  .wallet-theme .match-form input:focus,
  .wallet-theme .match-form select:focus,
  .wallet-theme .match-form textarea:focus {
    outline: none;
    border-color: rgba(34, 211, 238, 0.6);
    box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2);
  }

  .wallet-theme .transaction-list {
    display: grid;
    gap: 12px;
  }

  .wallet-theme .transaction-item {
    background: var(--wallet-surface);
    border: 1px solid var(--wallet-border);
    border-radius: 12px;
    padding: 12px;
    color: var(--wallet-heading);
    box-shadow: var(--wallet-soft-shadow);
  }

  .wallet-theme .transaction-amount.credit-text {
    color: var(--wallet-accent);
  }

  .wallet-theme .transaction-amount.debit-text {
    color: var(--wallet-accent-3);
  }

  .wallet-theme .transaction-indicator.credit {
    background: var(--wallet-accent);
    box-shadow: 0 0 10px rgba(34, 211, 238, 0.6);
  }

  .wallet-theme .transaction-indicator.debit {
    background: var(--wallet-accent-3);
    box-shadow: 0 0 10px rgba(244, 114, 182, 0.6);
  }

  .wallet-theme .status-badge {
    display: inline-block;
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border: 1px solid transparent;
  }

  .wallet-theme .status-pending {
    background-color: rgba(251, 191, 36, 0.18);
    color: #fbbf24;
    border-color: rgba(251, 191, 36, 0.4);
  }

  .wallet-theme .status-processing {
    background-color: rgba(34, 211, 238, 0.18);
    color: #22d3ee;
    border-color: rgba(34, 211, 238, 0.4);
  }

  .wallet-theme .status-completed {
    background-color: rgba(16, 185, 129, 0.18);
    color: #10b981;
    border-color: rgba(16, 185, 129, 0.4);
  }

  .wallet-theme .status-failed {
    background-color: rgba(239, 68, 68, 0.18);
    color: #f87171;
    border-color: rgba(239, 68, 68, 0.4);
  }

  .wallet-theme .status-cancelled {
    background-color: rgba(148, 163, 184, 0.18);
    color: #94a3b8;
    border-color: rgba(148, 163, 184, 0.4);
  }

  .wallet-theme .withdraw-header {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    align-items: flex-start;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .wallet-theme .withdraw-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
    gap: 1rem;
    align-items: start;
  }

  .wallet-theme .withdraw-panel,
  .wallet-theme .withdraw-summary {
    background: var(--wallet-surface);
    border: 1px solid var(--wallet-border);
    border-radius: 16px;
    box-shadow: var(--wallet-shadow);
    backdrop-filter: blur(14px);
    color: var(--wallet-heading);
  }

  .wallet-theme .withdraw-panel {
    padding: 1.25rem;
  }

  .wallet-theme .withdraw-summary {
    padding: 1rem;
    display: grid;
    gap: 1rem;
  }

  .wallet-theme .amount-input-wrap {
    position: relative;
  }

  .wallet-theme .amount-prefix {
    position: absolute;
    left: 0.9rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--wallet-text);
    font-weight: 700;
    pointer-events: none;
  }

  .wallet-theme .amount-input-wrap input {
    padding-left: 2rem;
    font-size: 1.15rem;
    font-weight: 700;
  }

  .wallet-theme .quick-amounts {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.75rem;
  }

  .wallet-theme .quick-amount {
    min-width: 52px;
    border: 1px solid var(--wallet-border);
    background: rgba(15, 23, 42, 0.42);
    color: var(--wallet-text);
    border-radius: 10px;
    padding: 0.45rem 0.65rem;
    font-weight: 700;
    cursor: pointer;
  }

  .wallet-theme .quick-amount:hover {
    border-color: rgba(34, 211, 238, 0.45);
    color: var(--wallet-heading);
  }

  body:not(.dark-theme) .wallet-theme .quick-amount {
    background: #f8fafc;
    color: #334155;
  }

  .wallet-theme .saved-method-toggle {
    border: 1px solid var(--wallet-border);
    border-radius: 12px;
    padding: 0.85rem;
    background: rgba(15, 23, 42, 0.28);
  }

  body:not(.dark-theme) .wallet-theme .saved-method-toggle {
    background: #f8fafc;
  }

  .wallet-theme .form-check {
    display: flex;
    align-items: center;
    gap: 0.65rem;
  }

  .wallet-theme .form-check-input {
    width: 18px;
    height: 18px;
    accent-color: var(--wallet-accent);
  }

  .wallet-theme .form-check-label {
    color: var(--wallet-heading);
    font-weight: 700;
  }

  .wallet-theme .saved-method-cards {
    display: grid;
    gap: 0.5rem;
    margin-top: 0.75rem;
  }

  .wallet-theme .saved-method-card {
    border: 1px solid var(--wallet-border);
    border-radius: 10px;
    padding: 0.7rem;
    display: grid;
    gap: 0.2rem;
    background: rgba(15, 23, 42, 0.3);
  }

  .wallet-theme .saved-method-card.is-selected {
    border-color: rgba(34, 211, 238, 0.55);
    background: rgba(34, 211, 238, 0.12);
  }

  body:not(.dark-theme) .wallet-theme .saved-method-card {
    background: #ffffff;
  }

  .wallet-theme .saved-method-label {
    color: var(--wallet-heading);
    font-weight: 700;
  }

  .wallet-theme .saved-method-meta,
  .wallet-theme .summary-label {
    color: var(--wallet-text);
    font-size: 0.85rem;
  }

  .wallet-theme .method-hint {
    margin-top: 0.5rem;
    border-left: 3px solid var(--wallet-accent);
    padding: 0.55rem 0.75rem;
    color: var(--wallet-text);
    background: rgba(34, 211, 238, 0.09);
    border-radius: 8px;
    font-size: 0.9rem;
  }

  .wallet-theme .form-error-panel {
    border: 1px solid rgba(244, 114, 182, 0.3);
    border-radius: 12px;
    padding: 0.75rem;
    background: rgba(244, 114, 182, 0.08);
    margin-bottom: 1rem;
  }

  .wallet-theme .summary-block {
    border: 1px solid var(--wallet-border);
    border-radius: 12px;
    padding: 0.9rem;
    background: rgba(15, 23, 42, 0.24);
  }

  body:not(.dark-theme) .wallet-theme .summary-block {
    background: #ffffff;
  }

  .wallet-theme .summary-balance {
    display: block;
    margin-top: 0.25rem;
    font-size: 2rem;
    color: var(--wallet-heading);
  }

  .wallet-theme .summary-list {
    display: grid;
    gap: 0.65rem;
    margin: 0.75rem 0 0;
  }

  .wallet-theme .summary-list div,
  .wallet-theme .mini-withdrawal {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    align-items: center;
  }

  .wallet-theme .summary-list dt {
    color: var(--wallet-text);
  }

  .wallet-theme .summary-list dd {
    color: var(--wallet-heading);
    margin: 0;
    font-weight: 700;
    text-align: right;
  }

  .wallet-theme .mini-withdrawals {
    display: grid;
    gap: 0.6rem;
    margin-top: 0.75rem;
  }

  .wallet-theme .mini-withdrawal {
    color: var(--wallet-heading);
    font-weight: 700;
  }

  @media (max-width: 820px) {
    .wallet-theme .withdraw-layout {
      grid-template-columns: 1fr;
    }

    .wallet-theme .withdraw-summary {
      order: -1;
    }

    .wallet-theme .form-actions {
      flex-direction: column-reverse;
    }

    .wallet-theme .form-actions .dashboard-button {
      width: 100%;
    }
  }
</style>
